{% extends "base.html" %}
{% block title %}Dashboard - UWA Swap-Meet{% endblock %}
{% block content %}
<div style="max-width: 1200px; margin: 4rem auto; padding: 2rem; text-align: center;">
<h1>Welcome, {{ user.display_name }}!</h1>
<p>{{ active_count }} active, {{ sold_count }} sold</p>
{% for listing in listings %}
<div>{{ listing.title }} - ${{ listing.price }}</div>
{% endfor %}
</div>
{% endblock %}
