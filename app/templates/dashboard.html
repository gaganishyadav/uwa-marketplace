{% extends "base.html" %}

{% block title %}Dashboard - UWA Swap-Meet{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 4rem auto; padding: 2rem; text-align: center;">
    <h1 style="font-family: var(--font-headline); font-size: 2rem; font-weight: 800; color: var(--color-on-surface); margin-bottom: 1rem;">
        Welcome, {{ user.display_name }}!
    </h1>
    <p style="font-size: 1.125rem; color: var(--color-on-surface-variant); margin-bottom: 2rem;">
        The marketplace is coming soon. You are logged in and verified.
    </p>
    <a href="{{ url_for('logout') }}" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-container) 100%); color: white; border-radius: 9999px; text-decoration: none; font-weight: 600; font-size: 0.875rem;">
        Logout
    </a>
</div>
{% endblock %}
